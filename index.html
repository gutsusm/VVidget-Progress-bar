<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Progress</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#191919;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
}

.widget{
    width:100%;
    aspect-ratio:1/1;
    max-width:420px;
    min-width:180px;

    padding:22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
}

.row{
    display:grid;
    grid-template-columns:52px 1fr 38px;
    align-items:center;
    gap:9px;
}

.label,
.percent{
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
}

.percent{
    text-align:right;
}

.bar{
    height:6px;
    background:#292929;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0;
    background:#fff;
    border-radius:20px;
    transition:width:.4s ease;
}

@media(max-width:260px){
    .widget{
        padding:14px;
        gap:10px;
    }

    .row{
        grid-template-columns:45px 1fr 34px;
        gap:6px;
    }

    .label,
    .percent{
        font-size:10px;
    }

    .bar{
        height:5px;
    }
}
</style>
</head>

<body>

<div class="widget">

    <div class="row">
        <div class="label">Year</div>
        <div class="bar"><div class="fill" id="year"></div></div>
        <div class="percent" id="yearText">0%</div>
    </div>

    <div class="row">
        <div class="label">Quarter</div>
        <div class="bar"><div class="fill" id="quarter"></div></div>
        <div class="percent" id="quarterText">0%</div>
    </div>

    <div class="row">
        <div class="label">Month</div>
        <div class="bar"><div class="fill" id="month"></div></div>
        <div class="percent" id="monthText">0%</div>
    </div>

    <div class="row">
        <div class="label">Week</div>
        <div class="bar"><div class="fill" id="week"></div></div>
        <div class="percent" id="weekText">0%</div>
    </div>

    <div class="row">
        <div class="label">Day</div>
        <div class="bar"><div class="fill" id="day"></div></div>
        <div class="percent" id="dayText">0%</div>
    </div>

</div>

<script>

function progress(start,end,now){
    return Math.max(0,Math.min(100,
        ((now-start)/(end-start))*100
    ));
}

function update(){

    const now=new Date();
    const y=now.getFullYear();
    const m=now.getMonth();
    const d=now.getDate();

    const yearStart=new Date(y,0,1);
    const yearEnd=new Date(y+1,0,1);

    const quarterStart=new Date(
        y,
        Math.floor(m/3)*3,
        1
    );

    const quarterEnd=new Date(
        y,
        Math.floor(m/3)*3+3,
        1
    );

    const monthStart=new Date(y,m,1);
    const monthEnd=new Date(y,m+1,1);

    const day=now.getDay();
    const monday=new Date(y,m,d-(day===0?6:day-1));
    monday.setHours(0,0,0,0);

    const sunday=new Date(monday);
    sunday.setDate(monday.getDate()+7);

    const dayStart=new Date(y,m,d);
    const dayEnd=new Date(y,m,d+1);

    set("year",progress(yearStart,yearEnd,now));
    set("quarter",progress(quarterStart,quarterEnd,now));
    set("month",progress(monthStart,monthEnd,now));
    set("week",progress(monday,sunday,now));
    set("day",progress(dayStart,dayEnd,now));
}

function set(id,value){

    const n=Math.floor(value);

    document.getElementById(id).style.width=n+"%";
    document.getElementById(id+"Text").textContent=n+"%";
}

update();
setInterval(update,1000);

</script>

</body>
</html>
