<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time Progress</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #191919;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: #ffffff;

    overflow: hidden;
}


/* =========================
   САМ ВИДЖЕТ
   ========================= */

.widget {

    width: 320px;
    height: 320px;

    padding: 24px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    gap: 16px;

    background: #191919;

}


/* =========================
   СТРОКА
   ========================= */

.row {

    width: 100%;

    display: grid;

    grid-template-columns:
        62px
        1fr
        42px;

    align-items: center;

    gap: 10px;

}


/* =========================
   ТЕКСТ
   ========================= */

.label {

    font-size: 13px;

    font-weight: 500;

    color: #ffffff;

    white-space: nowrap;

}


/* =========================
   ПРОЦЕНТ
   ========================= */

.percent {

    font-size: 13px;

    font-weight: 500;

    color: #ffffff;

    text-align: right;

    white-space: nowrap;

}


/* =========================
   ВНЕШНИЙ BAR
   ========================= */

.bar {

    width: 100%;

    height: 17px;

    background: #292929;

    border-radius: 100px;

    padding: 4px;

    overflow: hidden;

}


/* =========================
   ЗАПОЛНЕНИЕ
   ========================= */

.fill {

    width: 0%;

    height: 100%;

    background: #ffffff;

    border-radius: 100px;

    transition:
        width 0.5s ease;

}


/* =========================
   ЕСЛИ ЭКРАН МАЛЕНЬКИЙ
   ========================= */

@media (max-width: 340px) {

    .widget {

        width: 280px;
        height: 280px;

        padding: 18px;

        gap: 13px;

    }

    .row {

        grid-template-columns:
            52px
            1fr
            36px;

        gap: 7px;

    }

    .label,
    .percent {

        font-size: 11px;

    }

    .bar {

        height: 15px;

        padding: 3px;

    }

}

</style>
</head>


<body>


<div class="widget">


    <!-- YEAR -->

    <div class="row">

        <div class="label">
            Year
        </div>

        <div class="bar">

            <div
                class="fill"
                id="year">
            </div>

        </div>

        <div
            class="percent"
            id="yearText">
            0%
        </div>

    </div>


    <!-- QUARTER -->

    <div class="row">

        <div class="label">
            Quarter
        </div>

        <div class="bar">

            <div
                class="fill"
                id="quarter">
            </div>

        </div>

        <div
            class="percent"
            id="quarterText">
            0%
        </div>

    </div>


    <!-- MONTH -->

    <div class="row">

        <div class="label">
            Month
        </div>

        <div class="bar">

            <div
                class="fill"
                id="month">
            </div>

        </div>

        <div
            class="percent"
            id="monthText">
            0%
        </div>

    </div>


    <!-- WEEK -->

    <div class="row">

        <div class="label">
            Week
        </div>

        <div class="bar">

            <div
                class="fill"
                id="week">
            </div>

        </div>

        <div
            class="percent"
            id="weekText">
            0%
        </div>

    </div>


    <!-- DAY -->

    <div class="row">

        <div class="label">
            Day
        </div>

        <div class="bar">

            <div
                class="fill"
                id="day">
            </div>

        </div>

        <div
            class="percent"
            id="dayText">
            0%
        </div>

    </div>


</div>



<script>


/* =========================
   ПРОЦЕНТ
   ========================= */

function progress(start, end, now) {

    const value =
        ((now - start) /
        (end - start)) * 100;

    return Math.max(
        0,
        Math.min(100, value)
    );

}


/* =========================
   ОБНОВЛЕНИЕ
   ========================= */

function update() {

    const now =
        new Date();


    const year =
        now.getFullYear();

    const month =
        now.getMonth();

    const date =
        now.getDate();


    /* YEAR */

    const yearStart =
        new Date(
            year,
            0,
            1
        );

    const yearEnd =
        new Date(
            year + 1,
            0,
            1
        );


    /* QUARTER */

    const quarterMonth =
        Math.floor(month / 3) * 3;

    const quarterStart =
        new Date(
            year,
            quarterMonth,
            1
        );

    const quarterEnd =
        new Date(
            year,
            quarterMonth + 3,
            1
        );


    /* MONTH */

    const monthStart =
        new Date(
            year,
            month,
            1
        );

    const monthEnd =
        new Date(
            year,
            month + 1,
            1
        );


    /* WEEK */

    const dayOfWeek =
        now.getDay();

    const monday =
        new Date(
            year,
            month,
            date -
            (
                dayOfWeek === 0
                ? 6
                : dayOfWeek - 1
            )
        );


    monday.setHours(
        0,
        0,
        0,
        0
    );


    const nextMonday =
        new Date(
            monday
        );


    nextMonday.setDate(
        monday.getDate() + 7
    );


    /* DAY */

    const dayStart =
        new Date(
            year,
            month,
            date
        );

    const dayEnd =
        new Date(
            year,
            month,
            date + 1
        );


    /* YEAR */

    setProgress(
        "year",
        progress(
            yearStart,
            yearEnd,
            now
        )
    );


    /* QUARTER */

    setProgress(
        "quarter",
        progress(
            quarterStart,
            quarterEnd,
            now
        )
    );


    /* MONTH */

    setProgress(
        "month",
        progress(
            monthStart,
            monthEnd,
            now
        )
    );


    /* WEEK */

    setProgress(
        "week",
        progress(
            monday,
            nextMonday,
            now
        )
    );


    /* DAY */

    setProgress(
        "day",
        progress(
            dayStart,
            dayEnd,
            now
        )
    );

}


/* =========================
   ОТОБРАЖЕНИЕ
   ========================= */

function setProgress(
    id,
    value
) {

    const percent =
        Math.floor(value);


    document
        .getElementById(id)
        .style.width =
        percent + "%";


    document
        .getElementById(
            id + "Text"
        )
        .textContent =
        percent + "%";

}


/* =========================
   ЗАПУСК
   ========================= */

update();


setInterval(
    update,
    1000
);


</script>


</body>
</html>
